<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>응급레이더</title>
  <meta name="description" content="구급대원이 버튼 몇 번으로 지금 받아 줄 응급실을 찾는 웹 앱">
  <meta name="theme-color" content="#d2262d">
  <!-- 홈 화면·설치용 이름과 아이콘 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="응급레이더">
  <meta name="application-name" content="응급레이더">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: #ffffff; }
    @media (prefers-color-scheme: dark) { html, body { background: #0e1117; } }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    /* 서버가 깨어나는 동안 보이는 안내 */
    #wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; font-family: -apple-system, "Malgun Gothic", sans-serif;
            color: #5f6368; font-size: 15px; text-align: center; padding: 0 24px; }
    #wait img { width: 88px; height: 88px; border-radius: 20px; }
    #wait b { color: #d2262d; font-size: 22px; }
    @media (prefers-color-scheme: dark) { #wait { color: #c3c2b7; } }
  </style>
</head>
<body>
  <div id="wait">
    <img src="icons/icon-192.png" alt="">
    <b>응급레이더</b>
    <span>여는 중입니다. 오랫동안 쓰지 않았다면 서버가 깨어나는 데 30초~1분 걸릴 수 있습니다.</span>
  </div>
  <iframe id="app" title="응급레이더" allow="clipboard-write; geolocation"></iframe>
  <script>
    // 실제 앱(Streamlit)을 화면 가득 띄운다. 주소 뒤의 ?demo=1 같은 값은 그대로 넘긴다.
    var APP = "https://ems-collector-fc224frzqfak8autmfvxff.streamlit.app/";
    var q = new URLSearchParams(location.search);
    q.set("embed", "true");
    var frame = document.getElementById("app");
    frame.addEventListener("load", function () { document.getElementById("wait").style.display = "none"; });
    frame.src = APP + "?" + q.toString();
    if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
  </script>
</body>
</html>
